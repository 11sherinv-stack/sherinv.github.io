<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی ماز</title>
<style>
:root{--bg:#eef0f4;--ink:#1c2230;--muted:#667085;--card:#fff;--line:#ccd2dd;--btn:#2d6cdf;--btnink:#fff;--floor:#f8f6ee;--wall:#2b3345;--trail:#4f8cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--ink:#e8ecf3;--muted:#99a3b5;--card:#232833;--line:#384052;--btn:#5b94f5;--btnink:#0b1220;--floor:#1b2029;--wall:#aeb9d0;--trail:#5b94f5}}
:root[data-theme="dark"]{--bg:#14171d;--ink:#e8ecf3;--muted:#99a3b5;--card:#232833;--line:#384052;--btn:#5b94f5;--btnink:#0b1220;--floor:#1b2029;--wall:#aeb9d0;--trail:#5b94f5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:2px 0 6px;font-size:1.3rem}
.hud{display:flex;gap:10px;margin-bottom:6px}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 14px;text-align:center;font-size:.72rem;color:var(--muted)}
.hud b{display:block;font-size:1.05rem;color:var(--ink)}
.row{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap;justify-content:center}
button{font:inherit;border:0;background:var(--btn);color:var(--btnink);border-radius:8px;padding:7px 14px;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.on{outline:2px solid var(--btn)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{position:relative;width:min(94vw,480px)}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:8px;touch-action:none}
.over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,12,18,.78);color:#fff;border-radius:8px;text-align:center;padding:12px}
.over h2{margin:0}.over p{margin:0;line-height:1.8;opacity:.9}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:6px;margin-top:8px;direction:ltr}
.pad button{padding:0;font-size:1.3rem;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pad button:active{background:var(--btn);color:var(--btnink)}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
.hint{color:var(--muted);font-size:.76rem;margin-top:6px;text-align:center}
</style>
</head>
<body><a href="../index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>🧭 بازی ماز</h1>
<div class="hud"><div>زمان<b id="tm">۰:۰۰</b></div><div>قدم‌ها<b id="st">۰</b></div><div>رکورد<b id="bs">—</b></div></div>
<div class="row" id="lv"><button class="alt on" data-l="10">آسان</button><button class="alt" data-l="16">متوسط</button><button class="alt" data-l="24">سخت</button></div>
<div class="row"><button class="alt" id="hb">💡 راهنما (+۵ ثانیه)</button><button class="alt" id="fg">🔦 حالت تاریک</button><button id="nw">ماز جدید</button></div>
<div class="wrap"><canvas id="c" width="480" height="480"></canvas>
<div class="over" id="over"><h2>رسیدی! 🎉</h2><p id="ms"></p><button id="nx">ماز بعدی</button></div></div>
<div class="pad"><button class="u" data-d="0" aria-label="بالا">▲</button><button class="l" data-d="3" aria-label="چپ">◀</button><button class="d" data-d="2" aria-label="پایین">▼</button><button class="r" data-d="1" aria-label="راست">▶</button></div>
<div class="hint">جهت‌نماها یا WASD · روی ماز انگشت بکش · H راهنما · از 🟦 به 🏁 برس</div>
<script>
const W=480,$=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
let n=10,wl,px,py,trail,t0=0,steps=0,hints=0,fog=false,done=false,path=null,pathUntil=0,pal={},au;
function readPal(){const s=getComputedStyle(document.documentElement),g=k=>s.getPropertyValue(k).trim();pal={floor:g('--floor'),wall:g('--wall'),trail:g('--trail')}}
readPal();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readPal,50));
function beep(f,d=.06,ty='square'){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.025*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const bk=()=>'maze-best-'+n;
const fmt=s=>{s=Math.floor(s);return fa(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'))};
function loadBest(){let b=0;try{b=+localStorage.getItem(bk())||0}catch(e){}$('bs').textContent=b?fmt(b):'—';return b}
function gen(){
  wl=Array.from({length:n},()=>Array.from({length:n},()=>[1,1,1,1]));
  const vis=Array.from({length:n},()=>Array(n).fill(0)),st=[[0,0]];vis[0][0]=1;
  while(st.length){
    const[cx,cy]=st[st.length-1];
    const nb=D.filter(([dx,dy])=>{const a=cx+dx,b=cy+dy;return a>=0&&b>=0&&a<n&&b<n&&!vis[b][a]});
    if(!nb.length){st.pop();continue}
    const[dx,dy,w,o]=nb[Math.floor(Math.random()*nb.length)];
    wl[cy][cx][w]=0;wl[cy+dy][cx+dx][o]=0;vis[cy+dy][cx+dx]=1;st.push([cx+dx,cy+dy]);
  }
  for(let k=0;k<n*n/12;k++){ // a few extra openings so there are alternative routes
    const a=Math.floor(Math.random()*(n-1)),b=Math.floor(Math.random()*(n-1));
    if(Math.random()<.5){wl[b][a][1]=0;wl[b][a+1][3]=0}else{wl[b][a][2]=0;wl[b+1][a][0]=0}
  }
}
function newMaze(){
  gen();px=0;py=0;trail=[[0,0]];t0=0;steps=0;hints=0;done=false;path=null;
  $('over').style.display='none';$('st').textContent=fa(0);loadBest();
}
function move(d){
  if(done)return;
  if(wl[py][px][d]){beep(120,.04);return}
  px+=D[d][0];py+=D[d][1];steps++;
  if(!t0)t0=performance.now();
  const L=trail.length;
  if(L>1&&trail[L-2][0]===px&&trail[L-2][1]===py)trail.pop();else trail.push([px,py]);
  beep(300+steps%5*20,.03);$('st').textContent=fa(steps);
  if(px===n-1&&py===n-1)win();
}
const elapsed=()=>t0?(performance.now()-t0)/1000+hints*5:hints*5;
function win(){
  done=true;const t=elapsed();beep(880,.25,'triangle');
  let b=loadBest();const rec=!b||t<b;if(rec){try{localStorage.setItem(bk(),t)}catch(e){}loadBest()}
  $('ms').innerHTML='زمان: '+fmt(t)+' · قدم: '+fa(steps)+' · راهنما: '+fa(hints)+(rec?'<br>🏆 رکورد جدید!':'');
  $('over').style.display='flex';
}
function solve(){
  const prev=Array.from({length:n},()=>Array(n).fill(null)),q=[[px,py]];prev[py][px]=[-1,-1];
  while(q.length){const[cx,cy]=q.shift();if(cx===n-1&&cy===n-1)break;
    D.forEach(([dx,dy],d)=>{const a=cx+dx,b=cy+dy;if(!wl[cy][cx][d]&&a>=0&&b>=0&&a<n&&b<n&&!prev[b][a]){prev[b][a]=[cx,cy];q.push([a,b])}})}
  const p=[];let c=[n-1,n-1];while(c[0]>=0){p.push(c);c=prev[c[1]][c[0]]}return p.reverse();
}
function hint(){if(done)return;path=solve();pathUntil=performance.now()+3000;hints++;beep(660,.1,'triangle')}
function draw(now){
  const s=W/n;
  x.fillStyle=pal.floor;x.fillRect(0,0,W,W);
  x.fillStyle='rgba(255,193,7,.25)';x.fillRect((n-1)*s,(n-1)*s,s,s);
  x.fillStyle='rgba(79,140,255,.18)';x.fillRect(0,0,s,s);
  if(trail.length>1){x.strokeStyle=pal.trail;x.globalAlpha=.45;x.lineWidth=s*.28;x.lineCap='round';x.lineJoin='round';x.beginPath();trail.forEach(([a,b],i)=>{const X=a*s+s/2,Y=b*s+s/2;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.globalAlpha=1}
  if(path&&now<pathUntil){x.strokeStyle='#ffb300';x.lineWidth=s*.22;x.lineCap='round';x.setLineDash([s*.3,s*.3]);x.beginPath();path.forEach(([a,b],i)=>{const X=a*s+s/2,Y=b*s+s/2;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();x.setLineDash([])}
  x.strokeStyle=pal.wall;x.lineWidth=Math.max(2,s/9);x.lineCap='round';x.beginPath();
  for(let b=0;b<n;b++)for(let a=0;a<n;a++){const w=wl[b][a],X=a*s,Y=b*s;
    if(w[0]){x.moveTo(X,Y);x.lineTo(X+s,Y)}if(w[3]){x.moveTo(X,Y);x.lineTo(X,Y+s)}
    if(b===n-1&&w[2]){x.moveTo(X,Y+s);x.lineTo(X+s,Y+s)}if(a===n-1&&w[1]){x.moveTo(X+s,Y);x.lineTo(X+s,Y+s)}}
  x.stroke();
  x.font=Math.round(s*.7)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('🏁',(n-1)*s+s/2,(n-1)*s+s/2+1);
  const cx=px*s+s/2,cy=py*s+s/2,pulse=1+.06*Math.sin(now/200);
  x.fillStyle='#4f8cff';x.beginPath();x.arc(cx,cy,s*.3*pulse,0,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(cx-s*.08,cy-s*.08,s*.09,0,7);x.fill();
  if(fog){const g=x.createRadialGradient(cx,cy,s*1.2,cx,cy,s*3.4);g.addColorStop(0,'rgba(8,10,16,0)');g.addColorStop(1,'rgba(8,10,16,.97)');x.fillStyle=g;x.fillRect(0,0,W,W)}
}
function loop(now){if(!done&&t0)$('tm').textContent=fmt(elapsed());draw(now);requestAnimationFrame(loop)}
document.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{n=+b.dataset.l;document.querySelectorAll('#lv button').forEach(k=>k.classList.toggle('on',k===b));newMaze();$('tm').textContent=fmt(0)});
$('nw').onclick=()=>{newMaze();$('tm').textContent=fmt(0)};$('nx').onclick=$('nw').onclick;
$('hb').onclick=hint;
$('fg').onclick=()=>{fog=!fog;$('fg').classList.toggle('on',fog)};
document.querySelectorAll('.pad button').forEach(b=>{
  let t1,t2;const stop=()=>{clearTimeout(t1);clearInterval(t2)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();move(+b.dataset.d);t1=setTimeout(()=>{t2=setInterval(()=>move(+b.dataset.d),90)},220)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
});
addEventListener('keydown',e=>{
  const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3};
  if(e.key in m){e.preventDefault();move(m[e.key])}else if(e.key==='h')hint();else if(e.key==='Enter'&&done)$('nw').click();
});
let ax,ay;
cv.addEventListener('touchstart',e=>{ax=e.touches[0].clientX;ay=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(ax==null)return;const cs=cv.clientWidth/n*.55,dx=e.touches[0].clientX-ax,dy=e.touches[0].clientY-ay;
  if(Math.max(Math.abs(dx),Math.abs(dy))<cs)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));ax=e.touches[0].clientX;ay=e.touches[0].clientY;
},{passive:true});
newMaze();requestAnimationFrame(loop);
</script>
</body>
</html>
