<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Cards</title>
<style>
:root{--bg:#eef3e0;--ink:#26301a;--muted:#667a4d;--card:#fff;--line:rgba(60,80,30,.25);--btn:#14a89b;--btnink:#fff;--lime:#d9f24a;--tq:#14a89b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162011;--ink:#e9f3cc;--muted:#a9b98a;--card:#233018;--line:rgba(217,242,74,.22);--btn:#2fd5c3;--btnink:#08201d;--tq:#2fd5c3}}
:root[data-theme="dark"]{--bg:#162011;--ink:#e9f3cc;--muted:#a9b98a;--card:#233018;--line:rgba(217,242,74,.22);--btn:#2fd5c3;--btnink:#08201d;--tq:#2fd5c3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:2px 0 6px;font-size:1.3rem}
.row{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap;justify-content:center}
select,button.b{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pr{background:var(--btn);color:var(--btnink);border:0}
select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hud{display:flex;gap:8px;margin:6px 0}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 14px;text-align:center;font-size:.7rem;color:var(--muted)}
.hud b{display:block;font-size:1.05rem;color:var(--ink)}
.hud .on{outline:2px solid var(--tq)}
.wrap{position:relative;width:min(94vw,460px)}
#bd{display:grid;gap:8px;direction:ltr}
.cd{perspective:600px;background:none;border:0;padding:0;aspect-ratio:1;cursor:pointer}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.cd.fl .in{transform:rotateY(180deg)}
.in span{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr{background:linear-gradient(135deg,var(--tq),var(--lime));color:#fff;font-size:1.4rem;font-weight:800}
.bk{background:var(--card);transform:rotateY(180deg);border:2px solid var(--line);font-size:clamp(1.5rem,9vw,2.6rem)}
.cd.ok .bk{background:rgba(217,242,74,.55);border-color:var(--tq)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,18,8,.82);color:#fff;border-radius:12px;text-align:center;padding:14px}
.ov h2{margin:0}.ov p{margin:0;line-height:1.8}
.hint{color:var(--muted);font-size:.76rem;margin-top:10px;text-align:center}
</style>
</head>
<body><a href="index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>🃏 Memory Cards</h1>
<div class="row">
  <select id="lv" aria-label="سطح"><option value="0">آسان ۴×۳</option><option value="1" selected>متوسط ۴×۴</option><option value="2">سخت ۶×۴</option></select>
  <select id="md" aria-label="حالت"><option value="1">تک‌نفره</option><option value="2">دو نفره</option></select>
  <button class="b pr" id="nw">بازی جدید</button>
</div>
<div class="hud" id="hud"></div>
<div class="wrap"><div id="bd"></div><div class="ov" id="ov"><h2 id="ot"></h2><p id="om"></p><button class="b pr" id="ob">دوباره</button></div></div>
<div class="hint">دو کارت هم‌شکل را پیدا کن. در حالت دو نفره، هر جفت درست یک نوبت اضافه می‌دهد.</div>
<script>
const $=i=>document.getElementById(i),fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const EM=['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙','🦄','🐢','🐝','🦋'],LV=[[4,3],[4,4],[6,4]];
let cards,open=[],lock=false,moves=0,found=0,t0=0,tmr,players=1,turn=0,sc=[0,0],au;
function beep(f,d=.07){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const ft=s=>fa(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));
function bestKey(){return 'memory-best-'+$('lv').value}
function hud(){
  const bs=JSON.parse(localStorage.getItem(bestKey())||'null');
  const t=t0?Math.floor((Date.now()-t0)/1000):0;
  $('hud').innerHTML=players===1
    ?'<div>زمان<b>'+ft(t)+'</b></div><div>حرکت<b>'+fa(moves)+'</b></div><div>جفت‌ها<b>'+fa(found)+'/'+fa(cards.length/2)+'</b></div><div>رکورد<b>'+(bs?fa(bs.m)+' حرکت':'—')+'</b></div>'
    :'<div class="'+(turn===0?'on':'')+'">بازیکن ۱<b>'+fa(sc[0])+'</b></div><div>جفت‌ها<b>'+fa(found)+'/'+fa(cards.length/2)+'</b></div><div class="'+(turn===1?'on':'')+'">بازیکن ۲<b>'+fa(sc[1])+'</b></div>';
}
function newGame(){
  const[c,r]=LV[+$('lv').value];players=+$('md').value;
  const ems=EM.slice().sort(()=>Math.random()-.5).slice(0,c*r/2);
  cards=ems.concat(ems).sort(()=>Math.random()-.5).map((e,i)=>({e,i,ok:0}));
  open=[];lock=false;moves=0;found=0;t0=0;turn=0;sc=[0,0];clearInterval(tmr);$('ov').style.display='none';
  $('bd').style.gridTemplateColumns='repeat('+c+',1fr)';
  $('bd').innerHTML=cards.map((k,i)=>'<button class="cd" data-i="'+i+'" aria-label="کارت '+(i+1)+'"><div class="in"><span class="fr">؟</span><span class="bk">'+k.e+'</span></div></button>').join('');
  hud();
}
function el(i){return $('bd').children[i]}
function flip(i){
  const k=cards[i];if(lock||k.ok||open.includes(i))return;
  if(!t0){t0=Date.now();tmr=setInterval(hud,500)}
  open.push(i);el(i).classList.add('fl');beep(420+open.length*80);
  if(open.length<2)return;
  lock=true;moves++;const[a,b]=open;
  if(cards[a].e===cards[b].e){
    setTimeout(()=>{cards[a].ok=cards[b].ok=1;el(a).classList.add('ok');el(b).classList.add('ok');found++;if(players===2)sc[turn]++;open=[];lock=false;beep(760,.15);hud();if(found===cards.length/2)win()},450);
  }else setTimeout(()=>{el(a).classList.remove('fl');el(b).classList.remove('fl');open=[];lock=false;if(players===2)turn=1-turn;hud()},800);
  hud();
}
function win(){
  clearInterval(tmr);const t=Math.floor((Date.now()-t0)/1000);let m;
  if(players===1){
    const k=bestKey(),bs=JSON.parse(localStorage.getItem(k)||'null'),rec=!bs||moves<bs.m||(moves===bs.m&&t<bs.t);
    if(rec)try{localStorage.setItem(k,JSON.stringify({m:moves,t}))}catch(e){}
    $('ot').textContent=rec?'رکورد جدید! 🏆':'آفرین! 🎉';m='زمان: '+ft(t)+' · حرکت: '+fa(moves);
  }else{$('ot').textContent=sc[0]===sc[1]?'مساوی شد 🤝':'بازیکن '+fa(sc[0]>sc[1]?1:2)+' برنده شد 🏆';m=fa(sc[0])+' به '+fa(sc[1])}
  $('om').textContent=m;$('ov').style.display='flex';beep(900,.3);hud();
}
$('bd').addEventListener('click',e=>{const c=e.target.closest('.cd');if(c)flip(+c.dataset.i)});
$('nw').onclick=newGame;$('ob').onclick=newGame;$('lv').onchange=newGame;$('md').onchange=newGame;
newGame();
</script>
</body>
</html>
