<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkers</title>
<style>
:root{--bg:#eef0f4;--ink:#1c2230;--muted:#667085;--card:#fff;--line:#ccd2dd;--btn:#2d6cdf;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--ink:#e8ecf3;--muted:#99a3b5;--card:#232833;--line:#384052;--btn:#5b94f5;--btnink:#0b1220}}
:root[data-theme="dark"]{--bg:#14171d;--ink:#e8ecf3;--muted:#99a3b5;--card:#232833;--line:#384052;--btn:#5b94f5;--btnink:#0b1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:2px 0 6px;font-size:1.3rem}
.row{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap;justify-content:center;align-items:center}
select,button.b{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pr{background:var(--btn);color:var(--btnink);border:0}
button:disabled{opacity:.45}
select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#stt{min-height:1.8em;font-weight:700;margin:6px 0;text-align:center}
#bd{display:grid;grid-template-columns:repeat(8,1fr);width:min(96vw,480px);aspect-ratio:1;border:4px solid #5a3a1a;border-radius:6px;direction:ltr;overflow:hidden;--w:min(96vw,480px)}
.sq{position:relative;display:grid;place-items:center;cursor:pointer}
.sq.l{background:#f0d9b5}.sq.d{background:#b58863}
.sq.s{background:#f7ec6a}.sq.lm{box-shadow:inset 0 0 0 100px rgba(255,235,59,.3)}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.28)}
.pc{width:80%;height:80%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--w) / 8 * .4);box-shadow:0 3px 5px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.25);z-index:1;color:#ffd23f}
.pc.r{background:radial-gradient(circle at 35% 30%,#ff6b5e,#c4231b);border:2px solid #7a0f0a}
.pc.k{background:radial-gradient(circle at 35% 30%,#555,#111);border:2px solid #000}
.cap{display:flex;gap:10px;margin:4px 0;font-size:.8rem;color:var(--muted)}
.hint{color:var(--muted);font-size:.76rem;margin-top:8px;text-align:center;max-width:480px}
</style>
</head>
<body><a href="index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>🔴⚫ Checkers</h1>
<div class="row">
  <select id="md" aria-label="حالت"><option value="1">مقابل کامپیوتر</option><option value="2">دو نفره</option></select>
  <select id="lv" aria-label="سطح"><option value="1">آسان</option><option value="2" selected>متوسط</option><option value="3">سخت</option></select>
  <select id="sd" aria-label="رنگ تو"><option value="1">تو قرمز (شروع)</option><option value="-1">تو سیاه</option></select>
</div>
<div class="row"><button class="b pr" id="nw">بازی جدید</button><button class="b" id="un">↶ برگشت</button></div>
<div id="stt"></div>
<div id="bd"></div>
<div class="cap"><span>قرمز: <b id="cr">۱۲</b> مهره</span><span>سیاه: <b id="cb">۱۲</b> مهره</span></div>
<div class="hint">مهره را انتخاب کن و روی مقصد بزن. گرفتن مهره‌ی حریف اجباری است و زنجیره‌ای می‌شود. مهره‌ای که به آخر زمین برسد شاه (👑) می‌شود و هر دو جهت حرکت می‌کند.</div>
<script>
const $=i=>document.getElementById(i),bd=$('bd'),fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let b,turn,mode=1,lvl=2,human=1,sel=null,hist=[],over=false,busy=false,flip=false,lastMv=null,noProg=0,au;
function beep(f,d=.06){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
function init(){
  b=Array.from({length:8},()=>Array(8).fill(0));
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1){if(r<3)b[r][c]=-1;else if(r>4)b[r][c]=1}
  turn=1;sel=null;hist=[];over=false;busy=false;lastMv=null;noProg=0;
}
function jumps(bd,r,c,side,king,caps,path){
  const res=[],dirs=king?[[1,1],[1,-1],[-1,1],[-1,-1]]:side>0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]];
  for(const[dr,dc]of dirs){
    const mr=r+dr,mc=c+dc,tr=r+2*dr,tc=c+2*dc;
    if(tr<0||tr>7||tc<0||tc>7)continue;
    if(bd[mr][mc]*side<0&&bd[tr][tc]===0&&!caps.some(q=>q[0]===mr&&q[1]===mc)){
      const nc=caps.concat([[mr,mc]]),np=path.concat([[tr,tc]]),promo=!king&&((side>0&&tr===0)||(side<0&&tr===7));
      const more=promo?[]:jumps(bd,tr,tc,side,king,nc,np);
      if(more.length)res.push(...more);else res.push({path:np,caps:nc,king:king||promo});
    }
  }
  return res;
}
function moves(bd,side){
  const js=[],ss=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];if(!p||p*side<0)continue;
    const king=Math.abs(p)===2;
    bd[r][c]=0;const j=jumps(bd,r,c,side,king,[],[[r,c]]);bd[r][c]=p;
    j.forEach(m=>js.push({from:[r,c],path:m.path.slice(1),caps:m.caps,king:m.king}));
    if(!js.length){
      const dirs=king?[[1,1],[1,-1],[-1,1],[-1,-1]]:side>0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]];
      for(const[dr,dc]of dirs){const tr=r+dr,tc=c+dc;if(tr<0||tr>7||tc<0||tc>7||bd[tr][tc])continue;ss.push({from:[r,c],path:[[tr,tc]],caps:[],king:king||(side>0&&tr===0)||(side<0&&tr===7)})}
    }
  }
  return js.length?js:ss;
}
function apply(bd,m){
  const nb=bd.map(r=>r.slice()),[fr,fc]=m.from,p=nb[fr][fc],side=p>0?1:-1;
  nb[fr][fc]=0;m.caps.forEach(([r,c])=>nb[r][c]=0);
  const[tr,tc]=m.path[m.path.length-1];nb[tr][tc]=m.king?side*2:p;return nb;
}
function ev(bd){
  let s=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=bd[r][c];if(!p)continue;const side=p>0?1:-1,k=Math.abs(p)===2;
    let v=k?175:100;if(!k)v+=(side>0?7-r:r)*5;
    v+=(3.5-Math.abs(c-3.5))*2+(k?(3.5-Math.abs(r-3.5)):0);
    if(!k&&((side>0&&r===7)||(side<0&&r===0)))v+=8;
    s+=side*v;
  }
  return s;
}
function nega(bd,d,al,be,side){
  const ms=moves(bd,side);if(!ms.length)return -9000-d;if(d===0)return side*ev(bd);
  let best=-1e9;
  for(const m of ms){const v=-nega(apply(bd,m),d-1,-be,-al,-side);if(v>best)best=v;if(best>al)al=best;if(al>=be)break}
  return best;
}
function aiPick(side){
  const ms=moves(b,side);if(!ms.length)return null;
  if(ms.length===1)return ms[0];
  const depth=lvl===1?2:lvl===2?4:6;let best=-1e9,bm=[];
  for(const m of ms){
    const v=-nega(apply(b,m),depth-1,-1e9,1e9,-side)+(lvl===1?Math.random()*60:Math.random()*.5);
    if(v>best+.01){best=v;bm=[m]}else if(Math.abs(v-best)<=.01)bm.push(m);
  }
  return bm[Math.floor(Math.random()*bm.length)];
}
function counts(){let r=0,k=0;b.forEach(row=>row.forEach(p=>{if(p>0)r++;else if(p<0)k++}));return[r,k]}
function render(){
  const ms=over?[]:moves(b,turn),dests=sel?ms.filter(m=>m.from[0]===sel[0]&&m.from[1]===sel[1]).map(m=>m.path[m.path.length-1]):[];
  const order=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)order.push([r,c]);if(flip)order.reverse();
  bd.innerHTML=order.map(([r,c])=>{
    let cl='sq '+((r+c)%2?'d':'l');
    if(sel&&sel[0]===r&&sel[1]===c)cl+=' s';
    if(lastMv&&((lastMv.from[0]===r&&lastMv.from[1]===c)||(lastMv.to[0]===r&&lastMv.to[1]===c)))cl+=' lm';
    if(dests.some(d=>d[0]===r&&d[1]===c))cl+=' mv';
    const p=b[r][c];
    return '<div class="'+cl+'" data-r="'+r+'" data-c="'+c+'">'+(p?'<div class="pc '+(p>0?'r':'k')+'">'+(Math.abs(p)===2?'👑':'')+'</div>':'')+'</div>';
  }).join('');
  const[cr,ck]=counts();$('cr').textContent=fa(cr);$('cb').textContent=fa(ck);
}
function status(){
  if(over)return;
  const ms=moves(b,turn);
  if(!ms.length){over=true;const w=-turn;$('stt').textContent=mode===1?(w===human?'🎉 تو بردی!':'😅 کامپیوتر برد'):'🏆 '+(w===1?'قرمز':'سیاه')+' برنده شد';beep(w===human||mode===2?900:150,.4);return}
  if(noProg>=80){over=true;$('stt').textContent='🤝 مساوی شد';return}
  const must=ms[0].caps.length>0;
  $('stt').textContent=mode===1?(turn===human?'نوبت توست'+(must?' — گرفتن اجباری است!':''):'کامپیوتر فکر می‌کند…'):'نوبت '+(turn===1?'قرمز 🔴':'سیاه ⚫')+(must?' — گرفتن اجباری است!':'');
}
function doMove(m){
  hist.push({b:b.map(r=>r.slice()),turn,lastMv,noProg});
  const p=b[m.from[0]][m.from[1]];
  b=apply(b,m);const to=m.path[m.path.length-1];lastMv={from:m.from,to};
  noProg=(m.caps.length||(Math.abs(p)===1&&m.king))?0:noProg+1;
  turn=-turn;sel=null;beep(m.caps.length?220:380);render();status();
  if(!over&&mode===1&&turn!==human){busy=true;setTimeout(()=>{const am=aiPick(turn);busy=false;if(am)doMove(am)},500)}
}
bd.addEventListener('click',e=>{
  const el=e.target.closest('.sq');if(!el||over||busy)return;
  if(mode===1&&turn!==human)return;
  const r=+el.dataset.r,c=+el.dataset.c,ms=moves(b,turn);
  if(sel){
    const m=ms.find(q=>q.from[0]===sel[0]&&q.from[1]===sel[1]&&q.path[q.path.length-1][0]===r&&q.path[q.path.length-1][1]===c);
    if(m)return doMove(m);
  }
  if(b[r][c]*turn>0&&ms.some(q=>q.from[0]===r&&q.from[1]===c))sel=[r,c];else sel=null;
  render();
});
function newGame(){
  mode=+$('md').value;lvl=+$('lv').value;human=+$('sd').value;init();
  flip=mode===1&&human===-1;$('lv').style.display=$('sd').style.display=mode===1?'':'none';
  render();status();
  if(mode===1&&turn!==human){busy=true;setTimeout(()=>{const am=aiPick(turn);busy=false;if(am)doMove(am)},500)}
}
$('un').onclick=()=>{
  if(busy||!hist.length)return;
  let n=mode===1?(turn===human?2:1):1;
  while(n--&&hist.length){const h=hist.pop();b=h.b;turn=h.turn;lastMv=h.lastMv;noProg=h.noProg}
  over=false;sel=null;render();status();
  if(mode===1&&turn!==human&&!over){busy=true;setTimeout(()=>{const am=aiPick(turn);busy=false;if(am)doMove(am)},500)}
};
$('nw').onclick=newGame;['md','lv','sd'].forEach(i=>$(i).onchange=newGame);
newGame();
</script>
</body>
</html>
