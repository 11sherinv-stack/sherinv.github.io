<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Sort</title>
<style>
:root{--bg:#e6f1f8;--ink:#13263a;--muted:#5a7188;--card:#fff;--line:rgba(30,70,110,.25);--btn:#14a89b;--btnink:#fff;--glass:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a28;--ink:#e6f0fa;--muted:#8fa6bd;--card:#16273a;--line:rgba(140,190,240,.25);--btn:#2fd5c3;--btnink:#08201d;--glass:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#0e1a28;--ink:#e6f0fa;--muted:#8fa6bd;--card:#16273a;--line:rgba(140,190,240,.25);--btn:#2fd5c3;--btnink:#08201d;--glass:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:2px 0 6px;font-size:1.3rem}
.hud{display:flex;gap:8px;margin-bottom:6px}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 14px;text-align:center;font-size:.7rem;color:var(--muted)}
.hud b{display:block;font-size:1.05rem;color:var(--ink)}
.row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;justify-content:center}
button.b{font:inherit;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pr{background:var(--btn);color:var(--btnink);border:0}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{position:relative;width:min(96vw,520px)}
#bd{display:flex;flex-wrap:wrap;gap:22px 14px;justify-content:center;padding:34px 8px 10px;direction:ltr;min-height:320px;align-content:center}
.tb{width:48px;height:176px;border:3px solid var(--line);border-top-color:transparent;border-radius:0 0 26px 26px;background:var(--glass);display:flex;flex-direction:column-reverse;overflow:hidden;cursor:pointer;transition:transform .18s;position:relative}
.tb.sel{transform:translateY(-22px)}
.tb.done{box-shadow:0 0 0 3px #ffd23f}
.ly{height:25%;width:100%;flex:none}
.ly:first-child{border-radius:0 0 22px 22px}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,20,32,.84);color:#fff;border-radius:14px;text-align:center;padding:14px;z-index:5}
.ov h2{margin:0}
.hint{color:var(--muted);font-size:.76rem;margin-top:8px;text-align:center;max-width:480px}
</style>
</head>
<body><a href="index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>🧪 Color Water Sort</h1>
<div class="hud"><div>مرحله<b id="lv">۱</b></div><div>حرکت<b id="mv">۰</b></div><div>رکورد مرحله<b id="bs">—</b></div></div>
<div class="wrap"><div id="bd"></div><div class="ov" id="ov"><h2>🎉 مرحله تمام شد!</h2><p id="om"></p><button class="b pr" id="nx">مرحله‌ی بعد</button></div></div>
<div class="row"><button class="b" id="un">↶ برگشت</button><button class="b" id="at">➕ لوله‌ی اضافه</button><button class="b" id="rs">↻ شروع دوباره</button></div>
<div class="hint">یک لوله را انتخاب کن و بعد لوله‌ی مقصد را بزن. رنگ بالا فقط روی همان رنگ یا لوله‌ی خالی ریخته می‌شود. هر لوله باید یک رنگ شود.</div>
<script>
const $=i=>document.getElementById(i),fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const COL=['#e53935','#1e88e5','#43a047','#fdd835','#8e44ad','#fb8c00','#00bcd4','#ec407a','#6d4c41','#9ccc65','#5c6bc0','#90a4ae'],CAP=4;
let lvl=1,tubes,sel=-1,hist=[],moves=0,added=false,au;
try{lvl=+localStorage.getItem('watersort-level')||1}catch(e){}
function beep(f,d=.06){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.05*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
function gen(){
  const n=Math.min(12,2+lvl+(lvl>8?0:0));let units=[];for(let c=0;c<n;c++)for(let i=0;i<CAP;i++)units.push(c);
  do{units.sort(()=>Math.random()-.5);tubes=Array.from({length:n+2},()=>[]);units.forEach((u,i)=>tubes[Math.floor(i/CAP)].push(u))}while(tubes.slice(0,n).some(t=>t.every(c=>c===t[0])));
  sel=-1;hist=[];moves=0;added=false;$('ov').style.display='none';render();
}
function isDone(t){return t.length===CAP&&t.every(c=>c===t[0])}
function render(){
  $('bd').innerHTML=tubes.map((t,i)=>'<div class="tb'+(i===sel?' sel':'')+(isDone(t)?' done':'')+'" data-i="'+i+'" role="button" aria-label="لوله '+(i+1)+'">'+t.map(c=>'<div class="ly" style="background:'+COL[c]+'"></div>').join('')+'</div>').join('');
  $('lv').textContent=fa(lvl);$('mv').textContent=fa(moves);$('un').disabled=!hist.length;$('at').disabled=added;
  let b=null;try{b=+localStorage.getItem('watersort-best-'+lvl)||null}catch(e){}$('bs').textContent=b?fa(b):'—';
}
function pour(a,b){
  const A=tubes[a],B=tubes[b];if(!A.length||B.length>=CAP)return false;
  const c=A[A.length-1];if(B.length&&B[B.length-1]!==c)return false;
  hist.push(JSON.stringify(tubes));let k=0;
  while(A.length&&A[A.length-1]===c&&B.length<CAP){B.push(A.pop());k++}
  moves++;beep(380+k*60,.12);return true;
}
function check(){
  const ok=tubes.every(t=>t.length===0||isDone(t));
  if(!ok)return;
  let b=null;try{b=+localStorage.getItem('watersort-best-'+lvl)||null;if(!b||moves<b){localStorage.setItem('watersort-best-'+lvl,moves);b=moves}}catch(e){}
  $('om').textContent='حرکت‌ها: '+fa(moves)+(b===moves?' 🏆 بهترین':'');beep(900,.3);$('ov').style.display='flex';
}
$('bd').addEventListener('click',e=>{
  const el=e.target.closest('.tb');if(!el)return;const i=+el.dataset.i;
  if(sel<0){if(tubes[i].length&&!isDone(tubes[i])){sel=i;beep(500,.04)}}
  else if(sel===i)sel=-1;
  else{if(!pour(sel,i)){beep(160,.1);sel=tubes[i].length?i:-1}else sel=-1;}
  render();check();
});
$('un').onclick=()=>{if(!hist.length)return;tubes=JSON.parse(hist.pop());moves=Math.max(0,moves-1);sel=-1;render()};
$('at').onclick=()=>{if(added)return;tubes.push([]);added=true;render()};
$('rs').onclick=gen;
$('nx').onclick=()=>{lvl++;try{localStorage.setItem('watersort-level',lvl)}catch(e){}gen()};
gen();
</script>
</body>
</html>
