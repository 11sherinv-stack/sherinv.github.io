<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Paper Scissors</title>
<style>
:root{--bg:#eef3e0;--ink:#26301a;--muted:#667a4d;--card:#fff;--line:rgba(60,80,30,.25);--btn:#14a89b;--btnink:#fff;--win:#2e9e5b;--lose:#d9453b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162011;--ink:#e9f3cc;--muted:#a9b98a;--card:#233018;--line:rgba(217,242,74,.22);--btn:#2fd5c3;--btnink:#08201d;--win:#5fdc90;--lose:#ff7a6e}}
:root[data-theme="dark"]{--bg:#162011;--ink:#e9f3cc;--muted:#a9b98a;--card:#233018;--line:rgba(217,242,74,.22);--btn:#2fd5c3;--btnink:#08201d;--win:#5fdc90;--lose:#ff7a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:2px 0 8px;font-size:1.3rem}
.row{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap;justify-content:center;align-items:center}
select,button.b{font:inherit;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pr{background:var(--btn);color:var(--btnink);border:0}
select:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.score{display:flex;gap:12px;margin:8px 0;align-items:stretch}
.score div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 18px;text-align:center;font-size:.8rem;color:var(--muted);min-width:90px}
.score b{display:block;font-size:1.8rem;color:var(--ink)}
.arena{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;min-height:130px}
.hand{width:min(34vw,130px);aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:clamp(3rem,16vw,5rem);line-height:1}
.hand.shake{animation:sh .35s ease-in-out 3}
.hand.win{border-color:var(--win);box-shadow:0 0 0 4px var(--win)}
.hand.lose{opacity:.55}
@keyframes sh{50%{transform:translateY(-22px) rotate(8deg)}}
.vs{font-weight:800;color:var(--muted)}
#stt{min-height:2em;font-weight:800;font-size:1.1rem;margin:6px 0;text-align:center}
.picks{display:flex;gap:12px;margin:8px 0}
.picks button{width:min(26vw,96px);aspect-ratio:1;border-radius:20px;border:2px solid var(--line);background:var(--card);font-size:clamp(2.2rem,11vw,3.3rem);cursor:pointer;line-height:1}
.picks button:active{transform:scale(.92)}
.picks button:disabled{opacity:.4}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,18,8,.88);color:#fff;text-align:center;padding:16px;z-index:9}
.ov h2{margin:0}.ov p{margin:0}
.hint{color:var(--muted);font-size:.76rem;margin-top:8px;text-align:center;max-width:420px}
</style>
</head>
<body><a href="index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>✊✋✌️ Rock Paper Scissors</h1>
<div class="row">
  <select id="md" aria-label="حالت"><option value="1">مقابل کامپیوتر</option><option value="2">دو نفره</option></select>
  <select id="lv" aria-label="سطح"><option value="0">کامپیوتر: تصادفی</option><option value="1" selected>کامپیوتر: باهوش</option></select>
  <select id="to" aria-label="تا چند برد"><option value="2">تا ۲ برد</option><option value="3" selected>تا ۳ برد</option><option value="5">تا ۵ برد</option></select>
  <button class="b pr" id="nw">بازی جدید</button>
</div>
<div class="score"><div id="n1">تو<b id="s1">۰</b></div><div>مساوی<b id="sd">۰</b></div><div id="n2">کامپیوتر<b id="s2">۰</b></div></div>
<div class="arena"><div class="hand" id="h1">✊</div><div class="vs">VS</div><div class="hand" id="h2">✊</div></div>
<div id="stt"></div>
<div class="picks" id="pk"><button data-k="0" aria-label="سنگ">✊</button><button data-k="1" aria-label="کاغذ">✋</button><button data-k="2" aria-label="قیچی">✌️</button></div>
<div class="hint">سنگ قیچی را می‌شکند · قیچی کاغذ را می‌برد · کاغذ سنگ را می‌پوشاند. در حالت دو نفره، هر بازیکن مخفیانه انتخاب می‌کند.</div>
<div class="ov" id="ov"><h2 id="ot"></h2><p id="om"></p><button class="b pr" id="ob">باشه</button></div>
<script>
const $=i=>document.getElementById(i),EM=['✊','✋','✌️'],fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let mode=1,lvl=1,target=3,sc=[0,0],dr=0,pick1=null,turn=1,busy=false,hist=[],au,over=false;
function beep(f,d=.08){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const beats=(a,b)=>(a+2)%3===b; // 0 rock beats 2 scissors, 1 paper beats 0, 2 scissors beats 1
function ai(){
  if(lvl===0||hist.length<2)return Math.floor(Math.random()*3);
  const c=[0,0,0];hist.slice(-6).forEach(k=>c[k]++);
  const fav=c.indexOf(Math.max(...c));
  return Math.random()<.7?(fav+1)%3:Math.floor(Math.random()*3); // counter the player's most common choice
}
function newGame(){
  mode=+$('md').value;lvl=+$('lv').value;target=+$('to').value;sc=[0,0];dr=0;pick1=null;turn=1;busy=false;hist=[];over=false;
  $('lv').style.display=mode===1?'':'none';$('n1').firstChild.textContent=mode===1?'تو':'بازیکن ۱';$('n2').firstChild.textContent=mode===1?'کامپیوتر':'بازیکن ۲';
  ['h1','h2'].forEach(i=>{$(i).textContent='✊';$(i).className='hand'});$('ov').style.display='none';render();ask();
}
function render(){$('s1').textContent=fa(sc[0]);$('s2').textContent=fa(sc[1]);$('sd').textContent=fa(dr);$('pk').querySelectorAll('button').forEach(b=>b.disabled=busy||over)}
function ask(){$('stt').textContent=mode===1?'انتخاب کن!':'بازیکن '+fa(turn)+' — انتخاب کن (مخفیانه)'}
function choose(k){
  if(busy||over)return;beep(500,.05);
  if(mode===1){hist.push(k);reveal(k,ai());return}
  if(turn===1){pick1=k;turn=2;busy=true;render();
    $('ot').textContent='دستگاه را به بازیکن ۲ بده 📱';$('om').textContent='انتخاب بازیکن ۱ مخفی ماند';$('ob').textContent='آماده‌ام';$('ob').onclick=()=>{$('ov').style.display='none';busy=false;render();ask()};$('ov').style.display='flex';return}
  const a=pick1;pick1=null;turn=1;reveal(a,k);
}
function reveal(a,b){
  busy=true;render();$('stt').textContent='…';
  const h1=$('h1'),h2=$('h2');h1.textContent=h2.textContent='✊';h1.className=h2.className='hand shake';beep(300,.05);
  setTimeout(()=>{
    h1.className=h2.className='hand';h1.textContent=EM[a];h2.textContent=EM[b];
    let msg;
    if(a===b){dr++;msg='مساوی 🤝';beep(400,.12)}
    else if(beats(a,b)){sc[0]++;h1.classList.add('win');h2.classList.add('lose');msg=(mode===1?'تو بردی':'بازیکن ۱ برد')+' 🎉';beep(800,.15)}
    else{sc[1]++;h2.classList.add('win');h1.classList.add('lose');msg=(mode===1?'کامپیوتر برد':'بازیکن ۲ برد')+' 😅';beep(200,.15)}
    $('stt').textContent=msg;render();
    if(sc[0]>=target||sc[1]>=target){
      over=true;render();const w=sc[0]>=target?0:1;
      setTimeout(()=>{$('ot').textContent=(mode===1?(w===0?'🏆 تو برنده‌ی بازی شدی!':'کامپیوتر برنده‌ی بازی شد'):'🏆 بازیکن '+fa(w+1)+' برنده‌ی بازی شد!');$('om').textContent=fa(sc[0])+' - '+fa(sc[1]);$('ob').textContent='بازی جدید';$('ob').onclick=newGame;$('ov').style.display='flex';beep(w===0?950:180,.4)},900);
    }else setTimeout(()=>{busy=false;render();ask()},1100);
  },1100);
}
$('pk').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(+b.dataset.k)});
$('nw').onclick=newGame;['md','lv','to'].forEach(i=>$(i).onchange=newGame);
addEventListener('keydown',e=>{const m={r:0,p:1,s:2,'1':0,'2':1,'3':2};if(e.key in m)choose(m[e.key])});
newGame();
</script>
</body>
</html>
