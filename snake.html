<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مار پیشرفته</title>
<style>
:root{--bg:#eef3e6;--board:#dfe9d0;--grid:#d3e0c1;--rock:#7d8577;--wall:#2f6b3a;--ink:#1f2d1f;--muted:#5b6b57;--btn:#2f6b3a;--btnink:#f3f8ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#142016;--board:#1c2c1f;--grid:#223426;--rock:#59655a;--wall:#6fc27b;--ink:#e6f0e2;--muted:#93a890;--btn:#6fc27b;--btnink:#10200f}}
:root[data-theme="dark"]{--bg:#142016;--board:#1c2c1f;--grid:#223426;--rock:#59655a;--wall:#6fc27b;--ink:#e6f0e2;--muted:#93a890;--btn:#6fc27b;--btnink:#10200f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
h1{font-size:1.3rem;margin:2px 0 6px}
.hud{display:flex;gap:14px;font-size:.8rem;color:var(--muted);text-align:center}
.hud b{display:block;color:var(--ink);font-size:1.1rem}
.chips{min-height:26px;display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;justify-content:center;font-size:.78rem}
.chips span{background:var(--board);border:1px solid var(--muted);border-radius:12px;padding:2px 8px}
.wrap{position:relative;width:min(94vw,440px)}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:10px;touch-action:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(12,22,14,.8);color:#f1f7ec;border-radius:10px;text-align:center;padding:16px}
.over h2{margin:0;font-size:1.5rem}
.over p{margin:0;opacity:.85;font-size:.9rem;line-height:1.7}
.modes{display:flex;gap:8px}
button{font:inherit;border:0;background:var(--btn);color:var(--btnink);border-radius:10px;padding:9px 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.alt{background:transparent;color:inherit;border:2px solid #9ab39a;padding:7px 14px}
.alt.on{background:#f1f7ec;color:#16301a;border-color:#f1f7ec}
.row{display:flex;gap:8px;margin-top:10px}
.row .alt{color:var(--ink);border-color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;margin-top:10px;direction:ltr}
.pad button{padding:0;font-size:1.3rem}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
.hint{color:var(--muted);font-size:.78rem;margin-top:8px;text-align:center}
</style>
</head>
<body><a href="../index.html" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none">&larr; S loop</a>
<h1>🐍 مار پیشرفته</h1>
<div class="hud"><div>امتیاز<b id="sc">۰</b></div><div>رکورد<b id="bs">۰</b></div><div>مرحله<b id="lv">۱</b></div><div>ترکیب<b id="cb">×۱</b></div></div>
<div class="chips" id="chips"></div>
<div class="wrap">
  <canvas id="c" width="440" height="440"></canvas>
  <div class="over" id="over">
    <h2 id="ti">مار پیشرفته</h2>
    <p id="ms">میوه بخور، از سنگ‌ها فرار کن و آیتم‌های ویژه را بگیر.<br>⚡ سرعت · 🐢 کندی · 💎 امتیاز دو برابر · 🛡️ سپر · ✂️ کوتاه‌کردن · ⭐ ستاره</p>
    <div class="modes" id="modes"><button class="alt on" data-m="walls">دیوار مرگبار</button><button class="alt" data-m="wrap">بدون دیوار</button></div>
    <button id="go">شروع بازی</button>
  </div>
</div>
<div class="row"><button class="alt" id="pz">⏸ توقف</button><button class="alt" id="sn">🔊 صدا</button></div>
<div class="pad">
  <button class="u" data-d="u" aria-label="بالا">▲</button><button class="l" data-d="l" aria-label="چپ">◀</button>
  <button class="d" data-d="d" aria-label="پایین">▼</button><button class="r" data-d="r" aria-label="راست">▶</button>
</div>
<div class="hint">کلیدهای جهت‌نما یا WASD · فاصله یا P برای توقف · روی صفحه بکش</div>
<script>
const N=22,S=20,W=440,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=i=>document.getElementById(i);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const PW={spd:{e:'⚡'},slo:{e:'🐢'},dbl:{e:'💎'},shd:{e:'🛡️'},cut:{e:'✂️'}};
let mode='walls',snake,dir,q,items,rocks,parts,texts,score,eaten,lvl,combo,lastEat,grow,shield,shake;
let ef={spd:0,slo:0,dbl:0},acc=0,last=0,run=false,paused=false,snd=true,au,pal={},best=0;
function readPal(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();pal={board:g('--board'),grid:g('--grid'),rock:g('--rock'),wall:g('--wall')}}
readPal();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readPal,50));
const bk=()=>'snake2-best-'+mode;
function loadBest(){best=0;try{best=+localStorage.getItem(bk())||0}catch(e){}$('bs').textContent=fa(best)}
function beep(f,d=.08,ty='square',v=.04){if(!snd)return;try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*((location.hash.match(/v(\d+)/)||[0,100])[1]/100);o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const occ=(x,y)=>snake.some(s=>s[0]===x&&s[1]===y)||rocks.some(r=>r[0]===x&&r[1]===y)||items.some(i=>i.x===x&&i.y===y);
function free(minD){let x,y,n=0;do{x=Math.floor(Math.random()*N);y=Math.floor(Math.random()*N);n++}while((occ(x,y)||(minD&&Math.abs(x-snake[0][0])+Math.abs(y-snake[0][1])<minD))&&n<500);return[x,y]}
function newFood(){const[x,y]=free();items.push({k:'food',x,y})}
function special(){
  if(items.some(i=>i.k!=='food'))return;
  const[x,y]=free(),r=Math.random();
  if(r<.3)items.push({k:'star',x,y,ttl:8});
  else{const ks=Object.keys(PW);items.push({k:ks[Math.floor(Math.random()*ks.length)],x,y,ttl:10})}
}
function reset(){
  snake=[[11,11],[10,11],[9,11]];dir=V.r;q=[];items=[];rocks=[];parts=[];texts=[];
  score=0;eaten=0;lvl=1;combo=1;lastEat=0;grow=0;shield=false;shake=0;ef={spd:0,slo:0,dbl:0};acc=0;newFood();loadBest();
}
const interval=()=>Math.max(60,150-(lvl-1)*7)*(ef.spd>0?.6:ef.slo>0?1.6:1);
function burst(x,y,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;parts.push({x:x*S+S/2,y:y*S+S/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,c})}}
const float=(t,x,y,c='#ffd23f')=>texts.push({t,x:x*S+S/2,y:y*S,l:1,c});
function setDir(k){const v=V[k];if(!v)return;const r=q.length?q[q.length-1]:dir;if((v[0]===-r[0]&&v[1]===-r[1])||(v[0]===r[0]&&v[1]===r[1]))return;if(q.length<2)q.push(v)}
function eat(it){
  items=items.filter(i=>i!==it);
  const[x,y]=[it.x,it.y];
  if(it.k==='food'||it.k==='star'){
    const now=performance.now();combo=now-lastEat<3500?Math.min(5,combo+1):1;lastEat=now;
    const p=(it.k==='star'?50:10)*combo*(ef.dbl>0?2:1);
    score+=p;eaten++;grow+=it.k==='star'?3:1;
    float('+'+fa(p),x,y);burst(x,y,it.k==='star'?'#ffd23f':'#e5533d');beep(480+combo*90,.09);vib(15);
    const nl=1+Math.floor(eaten/5);
    if(nl>lvl){lvl=nl;float('مرحله '+fa(lvl)+'!',11,8,'#4fc3f7');beep(900,.25,'triangle');
      const t=Math.min(2*(lvl-1),16);while(rocks.length<t)rocks.push(free(5))}
    if(!items.some(i=>i.k==='food'))newFood();
    if(Math.random()<.4)special();
  }else{
    beep(700,.15,'triangle');burst(x,y,'#4fc3f7',18);
    if(it.k==='spd'){ef.spd=6;ef.slo=0}
    else if(it.k==='slo'){ef.slo=7;ef.spd=0}
    else if(it.k==='dbl')ef.dbl=10;
    else if(it.k==='shd')shield=true;
    else{snake.length=Math.max(3,snake.length-3);score+=20;float('+۲۰',x,y)}
  }
  $('sc').textContent=fa(score);
}
function tick(){
  if(q.length)dir=q.shift();
  let hx=snake[0][0]+dir[0],hy=snake[0][1]+dir[1],hit=0;
  if(hx<0||hy<0||hx>=N||hy>=N){if(mode==='wrap'){hx=(hx+N)%N;hy=(hy+N)%N}else hit='w'}
  if(!hit&&snake.slice(0,grow>0?snake.length:-1).some(s=>s[0]===hx&&s[1]===hy))hit='s';
  const rk=rocks.findIndex(r=>r[0]===hx&&r[1]===hy);
  if(!hit&&rk>-1)hit='r';
  if(hit){
    if(shield){shield=false;shake=10;burst(snake[0][0],snake[0][1],'#4fc3f7',22);beep(220,.2,'sawtooth');vib(40);
      if(hit==='w'){hx=(hx+N)%N;hy=(hy+N)%N}else if(hit==='r')rocks.splice(rk,1)}
    else return die();
  }
  snake.unshift([hx,hy]);
  const it=items.find(i=>i.x===hx&&i.y===hy);
  if(it)eat(it);
  if(grow>0)grow--;else snake.pop();
}
function die(){
  run=false;shake=14;burst(snake[0][0],snake[0][1],'#e5533d',30);vib([80,40,80]);beep(160,.4,'sawtooth');
  const rec=score>best;
  if(rec){best=score;try{localStorage.setItem(bk(),best)}catch(e){}$('bs').textContent=fa(best)}
  $('ti').textContent=rec&&score>0?'رکورد جدید! 🏆':'باختی!';
  $('ms').innerHTML='امتیاز: '+fa(score)+' · طول مار: '+fa(snake.length)+' · مرحله: '+fa(lvl);
  $('modes').style.display='flex';$('go').textContent='دوباره بازی کن';$('over').style.display='flex';
}
function startGame(){reset();run=true;paused=false;$('over').style.display='none';$('pz').textContent='⏸ توقف'}
function togglePause(){
  if(!run)return;paused=!paused;
  $('pz').textContent=paused?'▶ ادامه':'⏸ توقف';
  if(paused){$('ti').textContent='متوقف شد';$('ms').textContent='برای ادامه دکمه را بزن.';$('modes').style.display='none';$('go').textContent='ادامه';$('over').style.display='flex'}
  else $('over').style.display='none';
}
$('go').onclick=()=>run&&paused?togglePause():startGame();
$('pz').onclick=togglePause;
$('sn').onclick=()=>{snd=!snd;$('sn').textContent=snd?'🔊 صدا':'🔇 صدا'};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));loadBest()});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.d)}));
addEventListener('keydown',e=>{
  const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
  if(m[e.key]){e.preventDefault();setDir(m[e.key])}
  else if(e.key===' '||e.key==='p'){e.preventDefault();if(run)togglePause()}
  else if(e.key==='Enter'&&!run)startGame();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!paused)togglePause()});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(tx==null)return;
  const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
function draw(t){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle=pal.board;ctx.fillRect(0,0,W,W);
  ctx.fillStyle=pal.grid;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*S,y*S,S,S);
  if(mode==='walls'){ctx.strokeStyle=pal.wall;ctx.lineWidth=4;ctx.strokeRect(2,2,W-4,W-4)}
  ctx.fillStyle=pal.rock;
  rocks.forEach(r=>{ctx.beginPath();ctx.roundRect(r[0]*S+1,r[1]*S+1,S-2,S-2,5);ctx.fill()});
  ctx.textAlign='center';ctx.textBaseline='middle';
  items.forEach(i=>{
    if(i.ttl!=null&&i.ttl<3&&Math.floor(t/140)%2)return;
    const p=1+.12*Math.sin(t/180+i.x);
    ctx.font=Math.round(S*.85*p)+'px sans-serif';
    ctx.fillText(i.k==='food'?'🍎':i.k==='star'?'⭐':PW[i.k].e,i.x*S+S/2,i.y*S+S/2+1);
  });
  const hue=ef.dbl>0?45:ef.spd>0?190:ef.slo>0?260:130,L=snake.length;
  for(let i=L-1;i>=0;i--){
    const s=snake[i],l=Math.round(28+30*(1-i/L));
    ctx.fillStyle='hsl('+hue+',60%,'+l+'%)';
    ctx.beginPath();ctx.roundRect(s[0]*S+1,s[1]*S+1,S-2,S-2,i?5:9);ctx.fill();
  }
  if(L){
    const h=snake[0],cx=h[0]*S+S/2,cy=h[1]*S+S/2,px=-dir[1]*4,py=dir[0]*4;
    ctx.fillStyle='#fff';
    [1,-1].forEach(k=>{ctx.beginPath();ctx.arc(cx+dir[0]*4+px*k,cy+dir[1]*4+py*k,3,0,7);ctx.fill()});
    ctx.fillStyle='#111';
    [1,-1].forEach(k=>{ctx.beginPath();ctx.arc(cx+dir[0]*5+px*k,cy+dir[1]*5+py*k,1.5,0,7);ctx.fill()});
    if(shield){ctx.strokeStyle='#4fc3f7';ctx.lineWidth=3;ctx.globalAlpha=.6+.4*Math.sin(t/120);ctx.beginPath();ctx.arc(cx,cy,S*.8,0,7);ctx.stroke();ctx.globalAlpha=1}
  }
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()});
  ctx.globalAlpha=1;ctx.font='bold 15px sans-serif';
  texts.forEach(f=>{ctx.globalAlpha=Math.max(0,f.l);ctx.fillStyle=f.c;ctx.strokeStyle='#0008';ctx.lineWidth=3;ctx.strokeText(f.t,f.x,f.y);ctx.fillText(f.t,f.x,f.y)});
  ctx.globalAlpha=1;ctx.restore();
}
function hud(){
  $('lv').textContent=fa(lvl||1);$('cb').textContent='×'+fa(combo||1);
  const c=[];
  if(ef.spd>0)c.push('⚡ سرعت '+fa(Math.ceil(ef.spd)));
  if(ef.slo>0)c.push('🐢 کندی '+fa(Math.ceil(ef.slo)));
  if(ef.dbl>0)c.push('💎 دو برابر '+fa(Math.ceil(ef.dbl)));
  if(shield)c.push('🛡️ سپر');
  $('chips').innerHTML=c.map(x=>'<span>'+x+'</span>').join('');
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(run&&!paused){
    ['spd','slo','dbl'].forEach(k=>{if(ef[k]>0)ef[k]-=dt});
    items.forEach(i=>{if(i.ttl!=null)i.ttl-=dt});items=items.filter(i=>i.ttl==null||i.ttl>0);
    acc+=dt*1000;
    while(run&&acc>=interval()){acc-=interval();tick()}
  }
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  texts.forEach(f=>{f.y-=25*dt;f.l-=dt*.8});texts=texts.filter(f=>f.l>0);
  if(shake>0)shake=Math.max(0,shake-40*dt);
  draw(t);hud();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
